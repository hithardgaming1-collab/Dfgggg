name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q TVScan.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: TVScan
        run: >
          gradle assembleDebug
          -PVT_API_KEY="${{ secrets.VT_API_KEY }}"
          -PMB_API_KEY="${{ secrets.MB_API_KEY }}"
          -PMD_API_KEY="${{ secrets.MD_API_KEY }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TVScan-apk
          path: TVScan/app/build/outputs/apk/debug/app-debug.apk
