name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Optional API keys come from repo Settings > Secrets and variables > Actions
      - run: >
          gradle assembleDebug
          -PVT_API_KEY="${{ secrets.VT_API_KEY }}"
          -PMB_API_KEY="${{ secrets.MB_API_KEY }}"
          -PMD_API_KEY="${{ secrets.MD_API_KEY }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TVScan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
build.gradle.kts
settings.gradle.kts
gradle.properties
app/build.gradle.kts
app/src/main/AndroidManifest.xml
app/src/main/java/com/example/tvscan/MainActivity.kt
app/src/main/java/com/example/tvscan/Scanner.kt
